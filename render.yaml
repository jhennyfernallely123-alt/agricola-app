services:
  - type: web
    name: agricola-app
    runtime: php
    repo: https://github.com/jhennyfernallely123-alt/agricola-app
    plan: free
    region: oregon
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: bash start.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://agricola-app.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        generateValue: true
